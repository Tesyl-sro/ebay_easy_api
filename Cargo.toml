[package]
name = "ebay_easy_api"
version = "0.1.9"
edition = "2021"
authors = ["Fábián Varga <23280129+br0kenpixel@users.noreply.github.com>"]
description = "An easy API wrapper for Ebay"
homepage = "https://github.com/PixelWeatherProject"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/Tesyl-sro/ebay_easy_api"

[dependencies]
chrono = { version = "0.4.39", default-features = false, features = [
    "serde",
    "std",
] }
derive_more = { version = "1.0.0", default-features = false, features = [
    "display",
] }
enum-iterator = "2.1.0"
reqwest = { version = "0.12.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
] }
rust_decimal = { version = "1.36.0", default-features = false, features = [
    "serde",
    "serde-arbitrary-precision",
    "serde-float",
    "serde-str",
    "std",
] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.12.0"
thiserror = "2.0.11"
